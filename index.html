<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة تحكم الهوية</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
:root{--bg:#0e1116;--card:#171b23;--border:#262d3a;--accent:#d4a94c;--muted:#8b93a3;--danger:#e5484d;--ok:#34c17b;--text:#e9ecf1}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',sans-serif;background:radial-gradient(circle at 20% -10%,#1a2030 0%,var(--bg) 55%);color:var(--text);min-height:100vh;direction:rtl}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:40px 36px;width:100%;max-width:420px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.auth-card .badge{width:64px;height:64px;margin:0 auto 18px;border-radius:16px;background:linear-gradient(135deg,var(--accent),#7c5cff);display:flex;align-items:center;justify-content:center;font-size:28px}
.auth-card h1{font-size:22px;margin:0 0 8px}
.auth-card p{color:var(--muted);font-size:14px;line-height:1.8;margin-bottom:26px}
.btn-discord{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#5865F2;color:#fff;border:none;padding:14px 18px;border-radius:12px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none}
.error-msg{background:rgba(229,72,77,.12);border:1px solid rgba(229,72,77,.35);color:var(--danger);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(23,27,35,.7);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.user{display:flex;align-items:center;gap:12px}
.user img{width:34px;height:34px;border-radius:50%;border:2px solid var(--border)}
.logout-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:10px;font-family:inherit;font-size:13px;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:32px 24px 60px}
.char-tabs{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.char-tab{padding:8px 16px;border-radius:999px;border:1px solid var(--border);color:var(--muted);text-decoration:none;font-size:13px}
.char-tab.active{background:var(--accent);color:#16110a;border-color:var(--accent);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px}
.card h3{margin:0 0 16px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(52,193,123,.12);color:var(--ok);border:1px solid rgba(52,193,123,.3)}
.status-pill.pending{background:rgba(212,169,76,.12);color:var(--accent);border-color:rgba(212,169,76,.3)}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--border);font-size:14px}
.row:last-child{border-bottom:none}
.row .k{color:var(--muted)}
.row .v{font-weight:700}
.money-card{text-align:center}
.money-card .amount{font-size:30px;font-weight:900;color:var(--accent)}
.money-card .label{color:var(--muted);font-size:13px;margin-top:4px}
.empty-state{text-align:center;padding:80px 20px;color:var(--muted)}
</style>
</head>
<body>
<div id="app"><div class="center">جاري التحميل...</div></div>

<script>
const app = document.getElementById('app');
const params = new URLSearchParams(location.search);
const errorParam = params.get('error');

function esc(s){ return (s ?? '—').toString(); }
function money(n){ return (n||0).toLocaleString('en-US'); }

async function load() {
    const charParam = params.get('char') || '';
    const res = await fetch('/api/profile' + (charParam ? ('?char=' + charParam) : ''));
    const data = await res.json();

    if (!data.loggedIn) return renderLogin();
    if (!data.hasRole) return renderDenied(data);
    return renderDashboard(data);
}

function renderLogin() {
    app.innerHTML = `
    <div class="center">
      <div class="auth-card">
        <div class="badge">🪪</div>
        <h1>لوحة تحكم الهوية</h1>
        <p>سجل دخولك بحساب الديسكورد المرتبط بشخصيتك داخل السيرفر. الدخول متاح فقط لمن يملك رتبة الهوية المفعّلة من الإدارة.</p>
        ${errorParam ? '<div class="error-msg">صار خطأ أثناء تسجيل الدخول، حاول مرة ثانية.</div>' : ''}
        <a class="btn-discord" href="/auth/discord">تسجيل الدخول عبر ديسكورد</a>
      </div>
    </div>`;
}

function renderDenied(data) {
    app.innerHTML = `
    <div class="center">
      <div class="auth-card">
        <div class="badge">🚫</div>
        <h1>ما عندك صلاحية دخول</h1>
        <p>${esc(data.reason)}</p>
        <a class="btn-discord" style="background:#262d3a" href="/">رجوع</a>
      </div>
    </div>`;
}

function renderDashboard(data) {
    const { user, characters, selected, selectedIndex } = data;
    const avatar = user.avatar ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png` : '';

    let tabs = '';
    if (characters.length > 1) {
        tabs = `<div class="char-tabs">` + characters.map((c, i) => {
            const name = (c.id && c.id.first) ? `${c.id.first} ${c.id.last || ''}` : `شخصية ${i+1}`;
            return `<a class="char-tab ${i===selectedIndex?'active':''}" href="/?char=${i}">${esc(name)}</a>`;
        }).join('') + `</div>`;
    }

    let body;
    if (!characters.length) {
        body = `<div class="empty-state">ما لقينا أي شخصية مسجلة على حسابك بعد.<br>سوّي هويتك من داخل سيرفر الديسكورد ثم ارجع هنا.</div>`;
    } else {
        const id = selected.id || {};
        body = `
        ${tabs}
        <div class="grid" style="margin-bottom:18px">
          <div class="card money-card"><div class="amount">${money(selected.cash)}</div><div class="label">💵 الكاش</div></div>
          <div class="card money-card"><div class="amount">${money(selected.bank)}</div><div class="label">🏦 رصيد البنك</div></div>
        </div>
        <div class="grid">
          <div class="card">
            <h3>بيانات الهوية ${id.accepted ? '<span class="status-pill">✔ مفعّلة</span>' : '<span class="status-pill pending">قيد المراجعة</span>'}</h3>
            <div class="row"><span class="k">الاسم الأول</span><span class="v">${esc(id.first)}</span></div>
            <div class="row"><span class="k">الاسم الأخير</span><span class="v">${esc(id.last)}</span></div>
            <div class="row"><span class="k">تاريخ الميلاد</span><span class="v">${esc(id.date)}</span></div>
            <div class="row"><span class="k">مكان الميلاد</span><span class="v">${esc(id.place)}</span></div>
            <div class="row"><span class="k">الجنس</span><span class="v">${esc(id.gender)}</span></div>
            <div class="row"><span class="k">رقم الهوية</span><span class="v">${esc(id.number)}</span></div>
          </div>
          <div class="card">
            <h3>البيانات الوظيفية والمالية</h3>
            <div class="row"><span class="k">الوظيفة</span><span class="v">${esc(id.job || 'citizen')}</span></div>
            <div class="row"><span class="k">الآيبان</span><span class="v">${esc(id.iban)}</span></div>
            <div class="row"><span class="k">MDT</span><span class="v">${esc(id.mdt)}</span></div>
          </div>
        </div>`;
    }

    app.innerHTML = `
    <div class="topbar">
      <div class="brand"><span class="dot"></span> لوحة تحكم الرول بلاي</div>
      <div class="user">
        ${avatar ? `<img src="${avatar}">` : ''}
        <span style="color:var(--muted);font-size:14px">${esc(user.username)}</span>
        <form action="/auth/logout" method="POST"><button class="logout-btn" type="submit">تسجيل خروج</button></form>
      </div>
    </div>
    <div class="wrap">${body}</div>`;
}

load();
</script>
</body>
</html>
