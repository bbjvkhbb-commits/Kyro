<style>
  :root {
    --ink: #14110F;
    --sand: #EFE8DC;
    --clay: #A8552E;
    --line: #D8CDB8;
    --panel: #FBF8F2;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body {
    background: var(--sand);
    color: var(--ink);
    font-family: 'Tajawal', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 48px 36px;
    text-align: center;
  }
  .mark {
    width: 44px;
    height: 44px;
    margin: 0 auto 28px;
    border: 2px solid var(--clay);
    border-radius: 50%;
    position: relative;
  }
  .mark::after {
    content: "";
    position: absolute;
    inset: 10px;
    background: var(--clay);
    border-radius: 50%;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.4;
    margin: 0 0 10px;
  }
  p.sub {
    font-size: 15px;
    color: #6b6355;
    line-height: 1.7;
    margin: 0 0 32px;
  }
  form { display: flex; flex-direction: column; gap: 12px; }
  input[type="email"] {
    width: 100%;
    padding: 14px 16px;
    font-family: inherit;
    font-size: 15px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: #fff;
    color: var(--ink);
    text-align: right;
  }
  input[type="email"]:focus {
    outline: 2px solid var(--clay);
    outline-offset: 1px;
  }
  button {
    padding: 14px 16px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    background: var(--clay);
    color: #fff;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  button:hover { opacity: 0.9; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .error {
    font-size: 13px;
    color: var(--clay);
    min-height: 18px;
    margin-top: -2px;
  }
  .done { display: none; }
  .done.show { display: block; }
  .done .mark::after { background: var(--ink); }
  .form-wrap.hide { display: none; }
</style>
</head>
<body>

<div class="card">
  <div class="form-wrap" id="formWrap">
    <div class="mark"></div>
    <h1>Ai</h1>
    <p class="sub">سجّل الدخول بجوجل, واستمتع في الAi</p>
    <div id="g_id_signin" style="display:flex; justify-content:center;"></div>
    <div class="error" id="errorMsg"></div>
  </div>

  <div class="done" id="doneWrap">
    <div class="mark"></div>
    <h1 id="welcomeMsg">تم التسجيل</h1>
    <p class="sub" style="margin-bottom:0;">قريباً بنراسلك على بريدك</p>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  const GOOGLE_CLIENT_ID = "662212705160-21e57ar174ra1dlug3m77tq7h5j94mkg.apps.googleusercontent.com";

  function detectDevice() {
    const ua = navigator.userAgent;
    let device = "غير معروف";
    if (/iPhone/i.test(ua)) device = "iPhone";
    else if (/iPad/i.test(ua)) device = "iPad";
    else if (/Android/i.test(ua)) device = "Android";
    else if (/Macintosh/i.test(ua)) device = "Mac";
    else if (/Windows/i.test(ua)) device = "Windows";
    else if (/Linux/i.test(ua)) device = "Linux";
    return { device, userAgent: ua, platform: navigator.platform || "غير متاح" };
  }

  console.log("مدعوس جديدد:", detectDevice());

  function decodeJwt(token) {
    const payload = token.split('.')[1];
    const decoded = decodeURIComponent(
      atob(payload.replace(/-/g, '+').replace(/_/g, '/'))
        .split('')
        .map(c => '%' + c.charCodeAt(0).toString(16).padStart(2, '0'))
        .join('')
    );
    return JSON.parse(decoded);
  }

  function handleGoogleSignIn(response) {
    const user = decodeJwt(response.credential);
    const info = detectDevice();

    const payload = {
      email: user.email,
      first_name: user.given_name,
      last_name: user.family_name,
      full_name: user.name,
      picture: user.picture,
      device: info.device,
      userAgent: info.userAgent,
      platform: info.platform
    };

    console.log("تسجيل دخول جديد:", payload);

    fetch('/api/log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).catch(err => console.error('تعذر إرسال البيانات للسيرفر:', err));

    document.getElementById('welcomeMsg').textContent = "أهلاً " + (user.given_name || user.name);
    document.getElementById('formWrap').classList.add('hide');
    document.getElementById('doneWrap').classList.add('show');
  }

  window.onload = function () {
    if (typeof google === 'undefined') {
      document.getElementById('errorMsg').textContent = "تعذر تحميل خدمة تسجيل الدخول";
      return;
    }
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleGoogleSignIn
    });
    google.accounts.id.renderButton(
      document.getElementById('g_id_signin'),
      { theme: 'outline', size: 'large', shape: 'pill', locale: 'ar' }
    );
  };
</script>
